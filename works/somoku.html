<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Somoku | Eom, Nayun</title>

    <link rel="stylesheet" href="../style.css?v=4">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="identity">

            <a href="../index.html" class="identity-link">
                <strong>Eom, Nayun</strong>
            </a>

            <span>|</span>

            <span>Contemporary Jewelry Artist</span>

        </div>


        <nav class="navigation">

            <a href="../about.html">
                About
            </a>


            <!-- WORKS -->
            <div class="works-menu">

                <button
                    type="button"
                    class="works-link active">
                    Works
                </button>


                <div class="works-dropdown">

                    <a href="thorns.html">
                        Thorns
                    </a>

                    <a href="sinsuro-107.html">
                        Sinsuro-107
                    </a>

                    <a
                        href="not-gold-not-emerald.html"
                        class="two-line">
                        Not Gold,<br>
                        Not Emerald
                    </a>

                    <a href="somoku.html">
                        Somoku
                    </a>

                </div>

            </div>


            <!-- EXHIBITION -->
            <a href="../exhibition.html">
                Exhibition
            </a>


            <!-- RECORDS -->
            <a href="#">
                Records
            </a>

        </nav>

    </header>



    <!-- WORK -->
    <main class="works-page">

        <section class="work-gallery">


            <!-- IMAGE -->
            <div class="work-image-frame">

                <button
                    class="work-arrow work-arrow-left hidden"
                    id="prev-button"
                    aria-label="Previous image">
                    ‹
                </button>


                <img
                    id="work-image"
                    src="../images/works/Somoku.jpg"
                    alt="Somoku"
                >


                <button
                    class="work-arrow work-arrow-right"
                    id="next-button"
                    aria-label="Next image">
                    ›
                </button>

            </div>



            <!-- DOTS -->
            <div class="work-dots">

                <button
                    class="work-dot active"
                    data-index="0"
                    aria-label="Somoku">
                </button>

                <button
                    class="work-dot"
                    data-index="1"
                    aria-label="No. 1 Somoku">
                </button>

                <button
                    class="work-dot"
                    data-index="2"
                    aria-label="No. 2 Gentle Breeze">
                </button>

                <button
                    class="work-dot"
                    data-index="3"
                    aria-label="No. 3 Overlap">
                </button>

                <button
                    class="work-dot"
                    data-index="4"
                    aria-label="No. 4 Rainfall">
                </button>

            </div>



            <!-- TITLE -->
            <div class="work-heading">

                <h1 id="work-title"></h1>

                <p
                    id="work-material"
                    style="display: none;">
                </p>

            </div>



            <!-- DESCRIPTION -->
            <div class="work-description">

                <p id="work-intro"></p>

                <p id="work-text"></p>

            </div>

        </section>

    </main>



    <!-- FOOTER -->
    <footer>

        © 2026. Eom Nayun All rights reserved.

    </footer>



    <!-- WORK SLIDER + WORKS MENU -->
    <script>

        /* =========================
           WORK DATA
           ========================= */

        const works = [

            {
                images: [
                    "../images/works/Somoku.jpg"
                ],

                title: "Somoku",

                material: "",

                intro: `Somoku Series began with photographs, during a trip I took alone. On the last day of my trip to Damyang, a town known for bamboo, I was struck by the soft rain, the waving leaves, and the landscape filled with green. I wanted viewers to experience the scene and feeling I had at that moment through my work in an indirect way. I focused on the forms of bamboo, raindrops, and the way the leaves overlapped as they moved in the wind.`,

                text: `Rather than using glass as a substitute for gemstones, I explored expressions and joining structures that make use of the properties of glass.`
            },


            {
                images: [
                    "../images/works/Somoku-01.png",
                    "../images/works/Somoku-02.png",
                    "../images/works/Somoku-03.png"
                ],

                title: "No. 1 Somoku",

                material: "2026 / Glass, Alcohol tint, Black Oxide Finished Brass",

                intro: `The bamboo museum has many different kinds of bamboo growing in its garden. I was inspired by the way the different bamboos were intertwined and mixed together.`,

                text: ``
            },


            {
                images: [
                    "../images/works/Gentlebreeze-01.png",
                    "../images/works/Gentlebreeze-02.png"
                ],

                title: "No. 2 Gentle Breeze",

                material: "2026 / Glass, Brass",

                intro: `I was inspired by the bamboo leaves dancing in the wind, overlapping and coming together as if they were one body.`,

                text: ``
            },


            {
                images: [
                    "../images/works/Overlap-01.png",
                    "../images/works/Overlap-02.png"
                ],

                title: "No. 3 Overlap",

                material: "2026 / Glass, Brass",

                intro: `I found it interesting that similar forms could overlap and come together in different places to create one form.`,

                text: `I expressed this overlap and combination through the form of a brooch.`
            },


            {
                images: [
                    "../images/works/Rainfall-01.png",
                    "../images/works/Rainfall-02.png",
                    "../images/works/Rainfall-03.png"
                ],

                title: "No. 4 Rainfall",

                material: "2026 / Glass, Brass",

                intro: `This work began with the thought of warm and gentle drizzle surrounding the world.`,

                text: ``
            }

        ];



        /* =========================
           ELEMENTS
           ========================= */

        const image =
            document.getElementById("work-image");

        const title =
            document.getElementById("work-title");

        const material =
            document.getElementById("work-material");

        const intro =
            document.getElementById("work-intro");

        const text =
            document.getElementById("work-text");

        const dots =
            document.querySelectorAll(".work-dot");

        const prevButton =
            document.getElementById("prev-button");

        const nextButton =
            document.getElementById("next-button");



        /* =========================
           CURRENT STATE
           ========================= */

        let currentWork = 0;

        let currentImage = 0;



        /* =========================
           SHOW WORK
           ========================= */

        function showWork(index) {

            currentWork = index;

            currentImage = 0;

            const work = works[currentWork];


            image.src =
                work.images[currentImage];

            image.alt =
                work.title;


            title.textContent =
                work.title;


            material.textContent =
                work.material;


            if (work.material) {

                material.style.display =
                    "block";

            } else {

                material.style.display =
                    "none";

            }


            intro.innerHTML =
                work.intro;

            text.innerHTML =
                work.text;


            dots.forEach((dot, i) => {

                dot.classList.toggle(
                    "active",
                    i === currentWork
                );

            });


            updateArrows();

        }



        /* =========================
           SHOW IMAGE
           ========================= */

        function showImage(index) {

            const work =
                works[currentWork];

            currentImage = index;


            image.src =
                work.images[currentImage];

            image.alt =
                work.title;


            updateArrows();

        }



        /* =========================
           ARROWS
           ========================= */

        function updateArrows() {

            const work =
                works[currentWork];


            if (currentImage === 0) {

                prevButton.classList.add(
                    "hidden"
                );

            } else {

                prevButton.classList.remove(
                    "hidden"
                );

            }


            if (
                currentImage ===
                work.images.length - 1
            ) {

                nextButton.classList.add(
                    "hidden"
                );

            } else {

                nextButton.classList.remove(
                    "hidden"
                );

            }

        }



        /* =========================
           PREVIOUS IMAGE
           ========================= */

        prevButton.addEventListener(
            "click",
            function () {

                if (currentImage > 0) {

                    showImage(
                        currentImage - 1
                    );

                }

            }
        );



        /* =========================
           NEXT IMAGE
           ========================= */

        nextButton.addEventListener(
            "click",
            function () {

                const work =
                    works[currentWork];


                if (
                    currentImage <
                    work.images.length - 1
                ) {

                    showImage(
                        currentImage + 1
                    );

                }

            }
        );



        /* =========================
           DOTS
           ========================= */

        dots.forEach(dot => {

            dot.addEventListener(
                "click",
                function () {

                    const index =
                        Number(
                            this.dataset.index
                        );

                    showWork(index);

                }

            );

        });



        /* =========================
           WORKS MENU
           ========================= */

        const worksLink =
            document.querySelector(".works-link");

        const worksMenu =
            document.querySelector(".works-menu");


        worksLink.addEventListener(
            "click",
            function () {

                worksMenu.classList.toggle("open");

            }
        );



        /* =========================
           INITIAL
           ========================= */

        showWork(0);

    </script>

</body>

</html>
