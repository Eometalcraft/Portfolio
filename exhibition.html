<style>

/* =========================
   EXHIBITION
   ========================= */

.exhibition-page {
    width: 88%;
    max-width: 1400px;
    margin: 40px auto 0;
}

.exhibition-title {
    margin: 0 0 40px;
    font-size: 25px;
    font-weight: 700;
}

.exhibition-year {
    margin: 0 0 45px;
    padding-top: 0;
}

.exhibition-year + .exhibition-year {
    margin-top: 75px;
}

.exhibition-year h2 {
    margin: 0 0 35px;
    padding-bottom: 12px;

    border-bottom: 2px solid #aaaaaa;

    font-size: 25px;
    font-weight: 700;
}

.exhibition-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 70px;
    row-gap: 70px;
}

.exhibition-item {
    display: block;

    color: #111111;
    text-decoration: none;
}

.exhibition-item img {
    display: block;

    width: 100%;
    height: 430px;

    object-fit: contain;

    margin: 0 auto;
}

.exhibition-item-title {
    margin-top: 20px;

    text-align: center;

    font-size: 20px;
    font-weight: 400;
}


/* =========================
   EXHIBITION MOBILE
   ========================= */

@media (max-width: 1000px) {

    .exhibition-page {
        width: 88%;
    }

    .exhibition-grid {
        column-gap: 35px;
    }

    .exhibition-item img {
        height: 360px;
    }

}

@media (max-width: 600px) {

    .exhibition-page {
        width: 100%;
        margin-top: 30px;
    }

    .exhibition-title {
        font-size: 22px;
        margin-bottom: 30px;
    }

    .exhibition-year + .exhibition-year {
        margin-top: 55px;
    }

    .exhibition-year h2 {
        font-size: 22px;
        margin-bottom: 25px;
    }

    .exhibition-grid {
        grid-template-columns: repeat(2, 1fr);
        column-gap: 20px;
        row-gap: 45px;
    }

    .exhibition-item img {
        height: 280px;
    }

    .exhibition-item-title {
        margin-top: 12px;
        font-size: 16px;
    }

}

</style>

</head>
