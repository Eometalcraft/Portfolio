<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Somoku | Eom, Nayun</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

        <div class="identity">

            <a href="index.html" class="identity-link">
                <strong>Eom, Nayun</strong>
                <span>|</span>
                <span>Contemporary Jewelry Artist</span>
            </a>

        </div>


        <nav class="navigation">

            <a href="about.html">About</a>

            <div class="works-menu">

                <a href="works.html" class="works-link active">
                    Works
                </a>

                <div class="works-dropdown">

                    <a href="not-gold-not-emerald.html"
                       class="two-line">
                        Not Gold,<br>
                        Not Emerald
                    </a>

                    <a href="somoku.html">
                        Somoku
                    </a>

                    <a href="sinsuro.html">
                        Sinsuro
                    </a>

                    <a href="thorns.html">
                        Thorns
                    </a>

                </div>

            </div>

            <a href="exhibition.html">Exhibition</a>
            <a href="records.html">Records</a>

        </nav>

    </header>



    <!-- =========================
         WORKS
         ========================= -->

    <main class="works-page">

        <section class="work-gallery">


            <!-- IMAGE AREA -->

            <div class="work-image-frame">

                <button
                    class="work-arrow work-arrow-left"
                    id="prevButton"
                    aria-label="Previous image">
                    ‹
                </button>


                <img
                    id="workImage"
                    src="images/works/somoku.jpg"
                    alt="Somoku">


                <button
                    class="work-arrow work-arrow-right"
                    id="nextButton"
                    aria-label="Next image">
                    ›
                </button>

            </div>



            <!-- DOTS -->

            <div class="work-dots">

                <button
                    class="work-dot active"
                    data-work="0"
                    aria-label="Somoku">
                </button>

                <button
                    class="work-dot"
                    data-work="1"
                    aria-label="No. 1 Somoku">
                </button>

                <button
                    class="work-dot"
                    data-work="2"
                    aria-label="No. 2 Gentle Breeze">
                </button>

                <button
                    class="work-dot"
                    data-work="3"
                    aria-label="No. 3 Overlap">
                </button>

                <button
                    class="work-dot"
                    data-work="4"
                    aria-label="No. 4 Rainfall">
                </button>

            </div>



            <!-- =========================
                 WORK TITLE
                 ========================= -->

            <div class="work-heading" id="workHeading">
                <!-- JavaScript -->
            </div>


            <!-- =========================
                 WORK DESCRIPTION
                 ========================= -->

            <div class="work-description" id="workDescription">
                <!-- JavaScript -->
            </div>

        </section>

    </main>



    <!-- =========================
         SCRIPT
         ========================= -->

    <script>

        const works = [

            /* =========================
               0. SOMOKU INTRO
               ========================= */

            {
                images: [
                    "images/works/somoku.jpg"
                ],

                title: "",

                material: "",

                description: `
                    <p>
                        Somoku Series began with photographs, during a trip I took alone.
                        On the last day of my trip to Damyang, a town known for bamboo,
                        I was struck by the soft rain, the waving leaves, and the landscape
                        filled with green. I wanted viewers to experience the scene and
                        feeling I had at that moment through my work in an indirect way.
                        I focused on the forms of bamboo, raindrops, and the way the leaves
                        overlapped as they moved in the wind.
                    </p>

                    <p style="margin-top: 15px;">
                        Rather than using glass as a substitute for gemstones, I explored
                        expressions and joining structures that make use of the properties
                        of glass.
                    </p>
                `
            },


            /* =========================
               1. NO. 1 SOMOKU
               ========================= */

            {
                images: [
                    "images/works/somoku-01.png",
                    "images/works/somoku-02.png",
                    "images/works/somoku-03.png"
                ],

                title: "No. 1 Somoku",

                material:
                    "Glass, Alcohol tint, Black Oxide Finished Brass",

                description: `
                    <p>
                        The bamboo museum has many different kinds of bamboo growing
                        in its garden. I was inspired by the way the different bamboos
                        were intertwined and mixed together.
                    </p>
                `
            },


            /* =========================
               2. NO. 2 GENTLE BREEZE
               ========================= */

            {
                images: [
                    "images/works/gentlebreeze-01.png",
                    "images/works/gentlebreeze-02.png"
                ],

                title: "No. 2 Gentle Breeze",

                material:
                    "Glass, Brass",

                description: `
                    <p>
                        I was inspired by the bamboo leaves dancing in the wind,
                        overlapping and coming together as if they were one body.
                    </p>
                `
            },


            /* =========================
               3. NO. 3 OVERLAP
               ========================= */

            {
                images: [
                    "images/works/overlap-01.png",
                    "images/works/overlap-02.png"
                ],

                title: "No. 3 Overlap",

                material:
                    "Glass, Brass",

                description: `
                    <p>
                        I found it interesting that similar forms could overlap and
                        come together in different places to create one form.
                        I expressed this overlap and combination through the form
                        of a brooch.
                    </p>
                `
            },


            /* =========================
               4. NO. 4 RAINFALL
               ========================= */

            {
                images: [
                    "images/works/rainfall-01.png",
                    "images/works/rainfall-02.png",
                    "images/works/rainfall-03.png"
                ],

                title: "No. 4 Rainfall",

                material:
                    "Glass, Brass",

                description: `
                    <p>
                        This work began with the thought of warm and gentle drizzle
                        surrounding the world.
                    </p>
                `
            }

        ];



        /* =========================
           CURRENT STATE
           ========================= */

        let currentWork = 0;
        let currentImage = 0;



        /* =========================
           ELEMENTS
           ========================= */

        const workImage =
            document.getElementById("workImage");

        const workHeading =
            document.getElementById("workHeading");

        const workDescription =
            document.getElementById("workDescription");

        const prevButton =
            document.getElementById("prevButton");

        const nextButton =
            document.getElementById("nextButton");

        const dots =
            document.querySelectorAll(".work-dot");



        /* =========================
           UPDATE PAGE
           ========================= */

        function updatePage() {

            const work = works[currentWork];


            /* IMAGE */

            workImage.src =
                work.images[currentImage];

            workImage.alt =
                work.title || "Somoku";


            /* TITLE + MATERIAL */

            if (work.title) {

                workHeading.innerHTML = `
                    <h1>${work.title}</h1>
                    <p>${work.material}</p>
                `;

            } else {

                workHeading.innerHTML = "";

            }


            /* DESCRIPTION */

            workDescription.innerHTML =
                work.description;


            /* DOT */

            dots.forEach((dot, index) => {

                dot.classList.toggle(
                    "active",
                    index === currentWork
                );

            });


            /* LEFT ARROW */

            if (
                currentWork === 0 &&
                currentImage === 0
            ) {

                prevButton.classList.add("hidden");

            } else {

                prevButton.classList.remove("hidden");

            }


            /* RIGHT ARROW */

            nextButton.classList.remove("hidden");

        }



        /* =========================
           NEXT
           ========================= */

        function nextImage() {

            const work = works[currentWork];


            /* 같은 작품 안에서 다음 사진 */

            if (
                currentImage <
                work.images.length - 1
            ) {

                currentImage++;

            }


            /* 마지막 사진이면 다음 작품 */

            else if (
                currentWork <
                works.length - 1
            ) {

                currentWork++;
                currentImage = 0;

            }


            /* 마지막 작품의 마지막 사진 */

            else {

                currentWork = 0;
                currentImage = 0;

            }


            updatePage();

        }



        /* =========================
           PREVIOUS
           ========================= */

        function previousImage() {

            /* 현재 작품의 이전 사진 */

            if (currentImage > 0) {

                currentImage--;

            }


            /* 첫 사진이면 이전 작품의 마지막 사진 */

            else if (currentWork > 0) {

                currentWork--;

                currentImage =
                    works[currentWork].images.length - 1;

            }


            /* 첫 작품이면 마지막 작품으로 */

            else {

                currentWork =
                    works.length - 1;

                currentImage =
                    works[currentWork].images.length - 1;

            }


            updatePage();

        }



        /* =========================
           ARROWS
           ========================= */

        nextButton.addEventListener(
            "click",
            nextImage
        );


        prevButton.addEventListener(
            "click",
            previousImage
        );



        /* =========================
           DOTS
           ========================= */

        dots.forEach((dot, index) => {

            dot.addEventListener(
                "click",
                () => {

                    currentWork = index;
                    currentImage = 0;

                    updatePage();

                }
            );

        });



        /* =========================
           INITIALIZE
           ========================= */

        updatePage();

    </script>

</body>

</html>
